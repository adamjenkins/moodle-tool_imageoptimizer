name: tool_imageoptimizer
summary: 'An admin tool that automatically resizes and recompresses oversized images stored anywhere in Moodle''s file storage.'
description: |
  A scheduled task scans Moodle's file storage for image files above a
  configurable size threshold and resizes/recompresses them, reducing disk
  usage and improving page load times. Polling the files table sidesteps the
  lack of a universal "file uploaded" event in Moodle's file API, so images
  from every component are covered.
